[project]
name = "digital-resident"
version = "0.1.0"
description = "Цифровой Ординатор: СППР по АГ (RAG + LangGraph)"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "openai>=1.40.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "chromadb>=0.5.0",
  "pypdf>=4.0.0",
  "pydantic>=2.0.0",
  "streamlit>=1.35.0",
  "httpx>=0.27.0",
  "tenacity>=8.0.0",
  "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_resident"]
